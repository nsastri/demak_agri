  - pandas=3.0.1
  - scipy                      # installed via pip below
  - matplotlib=3.10.8
  - contourpy
  - cycler
  - fonttools
  - kiwisolver
  - pyparsing

  # ── Geospatial (conda) ────────────────────────────────────────────────────
