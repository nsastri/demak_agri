  - libgdal-hdf4
  - libgdal-hdf5
  - libgdal-netcdf
  - geos=3.14.1
  - proj                       # gdal 3.12.2 requires >=9.8, let conda resolve
  - pyproj=3.7.2
  - pysheds
  - pyshp
  - cartopy
  - descartes
  - geopy
  - geographiclib
  - mercantile
  - contextily
  - xyzservices
